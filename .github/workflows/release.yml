name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install PSR
        run: pip install python-semantic-release

      - name: Python Semantic Release
        id: semantic
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB }}
        run: |
          # Calculate version and update files
          # --no-vcs-release: GitHub Release is handled below
          # --no-changelog: changelog.txt is handled by build.py
          semantic-release version --no-vcs-release --no-changelog
          
          # Detect if a release was actually made
          if [ "$(git tag --points-at HEAD)" ]; then
            echo "released=true" >> $GITHUB_OUTPUT
            NEW_VER=$(git describe --tags --abbrev=0 | sed 's/^v//')
            echo "version=$NEW_VER" >> $GITHUB_OUTPUT
          else
            echo "released=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and Version ZIP
        if: steps.semantic.outputs.released == 'true'
        run: python3 build.py --version ${{ steps.semantic.outputs.version }}

      - name: Commit version bump
        if: steps.semantic.outputs.released == 'true'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add addon.xml changelog.txt
          git commit -m "chore: bump version to ${{ steps.semantic.outputs.version }} [skip ci]"
          git push

      - name: GitHub Release
        if: steps.semantic.outputs.released == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: script.iptv.xtream-to-m3u-*.zip
          tag_name: v${{ steps.semantic.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB }}

      - name: Trigger repository.verkurkie Update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_GITHUB }}
          repository: verkurkie/repository.verkurkie
          event-type: submodule-update
          client-payload: >
            {
              "new_version": "${{ steps.semantic.outputs.released == 'true' && steps.semantic.outputs.version || '' }}",
              "repo_name": "${{ github.event.repository.name }}"
            }
