name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Semantic Release
        id: semantic
        uses: python-semantic-release/python-semantic-release@v9.16.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changelog: false

      - name: Build and Version
        if: steps.semantic.outputs.released == 'true'
        run: |
          # Use the pre-installed python3 on the runner
          python3 build.py --version ${{ steps.semantic.outputs.version }}

      - name: Commit version bump
        if: steps.semantic.outputs.released == 'true'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add addon.xml changelog.txt
          git commit -m "chore: bump version to ${{ steps.semantic.outputs.version }} [skip ci]"
          git push

      - name: GitHub Release
        if: steps.semantic.outputs.released == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: script.iptv.xtream-to-m3u-*.zip
          tag_name: v${{ steps.semantic.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
